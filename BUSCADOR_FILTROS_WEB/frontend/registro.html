<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .strength-bar {
      height: 6px;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    #msg {
      margin-top: 1rem;
      font-size: 0.95rem;
      text-align: center;
    }

    .strength-bar {
  height: 6px;
  border-radius: 4px;
  transition: width 0.3s ease;
  width: 100%;
}

.strength-bar.weak {
  background-color: #dc3545; /* rojo */
  width: 33%;
}

.strength-bar.medium {
  background-color: #ffc107; /* amarillo */
  width: 66%;
}

.strength-bar.strong {
  background-color: #198754; /* verde */
  width: 100%;
}
  </style>
</head>
<body>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4 w-100" style="max-width: 500px;">
      <h4 class="text-center mb-3">Crear cuenta</h4>
      <form id="registroForm">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombre" required />
        </div>

        <div class="mb-3">
          <label for="usuario" class="form-label">Nombre de usuario</label>
          <input type="text" class="form-control" id="usuario" required />
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo Electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" autocomplete="off" required />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required />
          <div id="passwordHelp" class="form-text">
            Mínimo 8 caracteres, al menos una mayúscula, una minúscula y un número.
          </div>
          <div class="mt-2 bg-light">
            <div id="strengthBar" class="strength-bar bg-danger w-0"></div>
          </div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
          <div id="matchMsg" class="form-text text-danger"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        <div id="msg"></div>
      </form>
    </div>
  </div>

  <script>
const form = document.getElementById('registroForm');
const passwordInput = document.getElementById('password');
const confirmPasswordInput = document.getElementById('confirmPassword');
const strengthBar = document.getElementById('strengthBar');
const matchMsg = document.getElementById('matchMsg');
const msg = document.getElementById('msg');

const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

passwordInput.addEventListener('input', () => {
  updateStrengthBar(passwordInput.value);
  validateMatch();
});

confirmPasswordInput.addEventListener('input', () => {
  validateMatch();
});

function updateStrengthBar(password) {
  let fuerza = 0;
  if (password.length >= 8) fuerza++;
  if (/[a-z]/.test(password)) fuerza++;
  if (/[A-Z]/.test(password)) fuerza++;
  if (/\d/.test(password)) fuerza++;

  strengthBar.className = 'strength-bar'; // resetear clases

  if (fuerza <= 2) {
    strengthBar.classList.add('weak');
  } else if (fuerza === 3) {
    strengthBar.classList.add('medium');
  } else if (fuerza === 4) {
    strengthBar.classList.add('strong');
  } else {
    // si no cumple nada, la barra se oculta o queda vacía
    strengthBar.style.width = '0';
  }
}

function validateMatch() {
  const pass = passwordInput.value;
  const confirm = confirmPasswordInput.value;
  if (confirm && pass !== confirm) {
    matchMsg.textContent = '❌ Las contraseñas no coinciden';
  } else {
    matchMsg.textContent = '';
  }
}

function sanitizar(texto) {
  return texto.trim().replace(/[<>{}()[\];'"\\]/g, '');
}

function validarUsuario(usuario) {
  return /^[a-zA-Z0-9_.\-]{3,30}$/.test(usuario);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const nombre = sanitizar(document.getElementById('nombre').value);
  const usuario = sanitizar(document.getElementById('usuario').value);
  const correo = document.getElementById('correo').value.trim();
  const password = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if (!nombre || !usuario || !correo || !password || !confirmPassword) {
    msg.textContent = '⚠️ Todos los campos son obligatorios';
    msg.className = 'text-danger';
    return;
  }

  if (!validarUsuario(usuario)) {
    msg.textContent = '⚠️ Usuario inválido. Sin espacios. Usa solo letras, números, guiones y guiones bajos (mín. 3 caracteres)';
    msg.className = 'text-danger';
    return;
  }

  if (!regex.test(password)) {
    msg.textContent = '❌ La contraseña no cumple con los requisitos';
    msg.className = 'text-danger';
    return;
  }

  if (password !== confirmPassword) {
    msg.textContent = '❌ Las contraseñas no coinciden';
    msg.className = 'text-danger';
    return;
  }

  try {
    const res = await fetch('http://localhost:4000/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, correo, usuario, password }),
    });

    let data;
    try {
      data = await res.json(); // intenta leer JSON
    } catch {
      // si no es JSON, mostramos error genérico y salimos
      msg.textContent = '❌ Error inesperado del servidor';
      msg.className = 'text-danger';
      return;
    }

    if (res.ok) {
      // Registro exitoso: login automático
      try {
        const loginRes = await fetch('http://localhost:4000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ correo, password }),
        });

        if (loginRes.ok) {
          msg.textContent = '✅ Registro e inicio de sesión exitosos. Redirigiendo...';
          msg.className = 'text-success';
          setTimeout(() => window.location.href = 'index.html', 2000);
        } else {
          msg.textContent = '⚠️ Registro exitoso, pero no se pudo iniciar sesión automáticamente.';
          msg.className = 'text-warning';
        }
      } catch {
        msg.textContent = '❌ Error al iniciar sesión automáticamente';
        msg.className = 'text-danger';
      }
    } else {
      // Aquí mostramos el mensaje que viene del backend aunque sea error HTTP (409)
      msg.textContent = `❌ ${data.body || 'Error al registrarse'}`;
      msg.className = 'text-danger';
    }
  } catch {
    msg.textContent = '❌ Error del servidor o red';
    msg.className = 'text-danger';
  }
});
  </script>
</body>
</html>
