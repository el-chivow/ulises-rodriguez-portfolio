<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cambiar contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    #msg {
      margin-top: 1rem;
      font-size: 0.95rem;
      text-align: center;
    }
    .strength-bar {
      height: 6px;
      margin-top: 5px;
      border-radius: 4px;
    }
    .weak {
      width: 33%;
      background-color: red;
    }
    .medium {
      width: 66%;
      background-color: orange;
    }
    .strong {
      width: 100%;
      background-color: green;
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4 w-100" style="max-width: 400px;">
      <h4 class="text-center mb-3">Nueva contraseña</h4>
      <form id="formPassword">
        <div class="mb-3">
          <label for="nuevaPassword" class="form-label">Contraseña nueva</label>
          <input type="password" class="form-control" id="nuevaPassword" placeholder="Ej. Hola1234" required />
          <div class="strength-bar mt-1" id="strengthBar"></div>
          <small id="passwordHelp" class="form-text text-muted">Debe tener mínimo 8 caracteres, una mayúscula, una minúscula y un número.</small>
        </div>
        <div class="mb-3">
          <label for="confirmarPassword" class="form-label">Repetir contraseña</label>
          <input type="password" class="form-control" id="confirmarPassword" required />
          <div id="coincidencia" class="form-text text-danger"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Cambiar</button>
        <div id="msg"></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('formPassword');
    const msg = document.getElementById('msg');
    const nuevaPassword = document.getElementById('nuevaPassword');
    const confirmarPassword = document.getElementById('confirmarPassword');
    const coincidencia = document.getElementById('coincidencia');
    const strengthBar = document.getElementById('strengthBar');

    const correo = sessionStorage.getItem('correo');
    const codigo = sessionStorage.getItem('codigo');

    if (!correo || !codigo) {
      window.location.href = 'solicitar-cambios.html';
    }

    function validarPassword(password) {
      const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
      return regex.test(password);
    }

    function actualizarBarra(password) {
      let fuerza = 0;
      if (password.length >= 8) fuerza++;
      if (/[a-z]/.test(password)) fuerza++;
      if (/[A-Z]/.test(password)) fuerza++;
      if (/\d/.test(password)) fuerza++;

      strengthBar.className = 'strength-bar';

      if (fuerza <= 2) {
        strengthBar.classList.add('weak');
      } else if (fuerza === 3) {
        strengthBar.classList.add('medium');
      } else {
        strengthBar.classList.add('strong');
      }
    }

    nuevaPassword.addEventListener('input', () => {
      const pwd = nuevaPassword.value;
      actualizarBarra(pwd);
      verificarCoincidencia();
    });

    confirmarPassword.addEventListener('input', verificarCoincidencia);

    function verificarCoincidencia() {
      if (confirmarPassword.value !== nuevaPassword.value) {
        coincidencia.textContent = '🔴 Las contraseñas no coinciden';
      } else {
        coincidencia.textContent = '';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = nuevaPassword.value;

      if (!validarPassword(pwd)) {
        msg.textContent = '🔴 La contraseña no cumple los requisitos';
        msg.className = 'text-danger';
        return;
      }

      if (pwd !== confirmarPassword.value) {
        msg.textContent = '🔴 Las contraseñas no coinciden';
        msg.className = 'text-danger';
        return;
      }

      try {
        const res = await fetch('http://localhost:4000/api/auth/cambiar-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo, codigo, nuevaPassword: pwd })
        });

        const data = await res.json();

        if (res.ok) {
          msg.textContent = '✅ Contraseña cambiada exitosamente. Redirigiendo...';
          msg.className = 'text-success';
          sessionStorage.clear();
          setTimeout(() => window.location.href = 'sesion.html', 2000);
        } else {
          msg.textContent = `🔴 ${data.message || 'Error al cambiar la contraseña'}`;
          msg.className = 'text-danger';
        }
      } catch (error) {
        msg.textContent = '❌ Error de red o del servidor';
        msg.className = 'text-danger';
      }
    });
  </script>
</body>
</html>
