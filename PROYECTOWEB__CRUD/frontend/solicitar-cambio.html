<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar cuenta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    #msg {
      margin-top: 1rem;
      font-size: 0.95rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4 w-100" style="max-width: 400px;">
      <h4 class="text-center mb-3">Recupera tu cuenta</h4>
      <form id="formReset">
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="correo" placeholder="Tu correo" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Enviar código</button>
        <div id="msg" class=""></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('formReset');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const correo = document.getElementById('correo').value;

      if (!correo || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
        msg.textContent = '🔴 Ingresa un correo válido';
        msg.className = 'text-danger';
        return;
      }

      try {
        const res = await fetch('http://localhost:4000/api/auth/solicitar-cambio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo })
        });

        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('correo', correo);
          msg.textContent = '📧 Código enviado al correo';
          msg.className = 'text-success';
          setTimeout(() => {
            window.location.href = 'verificar-codigo.html';
          }, 2000);
        } else {
          msg.textContent = `🔴 ${data.message || 'Error al enviar el código'}`;
          msg.className = 'text-danger';
        }
      } catch (error) {
        msg.textContent = '❌ Error de red';
        msg.className = 'text-danger';
      }
    });
  </script>
</body>
</html>
